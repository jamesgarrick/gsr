name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: gsr
